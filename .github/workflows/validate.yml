name: Validate Android package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Test, lint and check public API
        run: ./gradlew --no-daemon :android:check :android:assembleDebug :android:assembleRelease
      - name: Publish to a local test repository
        run: ./gradlew --no-daemon :android:publishReleasePublicationToTestRepository
      - name: Build independent consumers with and without the Grafana layer
        run: >-
          ./gradlew --no-daemon -p consumer
          assembleGrafanaDebug assembleGrafanaRelease
          assembleUpstreamDebug assembleUpstreamRelease
          checkRemovalDependencies lintGrafanaDebug lintUpstreamDebug
      - name: Ensure validation did not rewrite tracked files
        run: git diff --exit-code
